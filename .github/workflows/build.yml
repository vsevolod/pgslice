name: build
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    runs-on: eks-hosted-small
    container:
      image: ruby:${{ matrix.ruby }}
    env:
      PGSLICE_URL: postgres://postgres:postgres@postgres:5432/pgslice_test
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgslice_test
        options: >-
          --health-cmd "pg_isready -U postgres -d pgslice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "4.0.6"
            postgres: 18
          - ruby: 3.4
            postgres: 17
          - ruby: 3.3
            postgres: 16
          - ruby: 3.2
            postgres: 15
          - ruby: 3.1
            postgres: 14
          - ruby: "3.0"
            postgres: 13
    steps:
      - uses: actions/checkout@v7
      - run: bundle install
      - run: bundle exec rake test

  package:
    name: Build gem
    needs: build
    runs-on: eks-hosted-small
    container:
      image: ruby:4.0.6
    steps:
      - uses: actions/checkout@v7
      - run: gem build pgslice.gemspec
      - uses: actions/upload-artifact@v7
        with:
          name: pgslice-gem
          path: pgslice-*.gem
          if-no-files-found: error
